# Local deployment: Ollama (LLMs) + the RAG grader API/dashboard.
#
#   cp .env.example .env        # optional: change models, ports, admin token
#   docker compose up -d --build
#   open http://localhost:8000
#
# First start pulls the generator and judge models (several GB) into the
# `ollama` volume; later starts reuse them.

services:
  ollama:
    image: ollama/ollama:0.40.11
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    # NVIDIA GPU (needs the NVIDIA Container Toolkit). Remove this block on CPU-only hosts.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:0.40.11
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${SQLRAG_GENERATOR_MODEL:-llama3.2:3b} && ollama pull ${SQLRAG_JUDGE_MODEL:-qwen2.5:3b}"]
    restart: "no"

  app:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      SQLRAG_GENERATOR_MODEL: ${SQLRAG_GENERATOR_MODEL:-llama3.2:3b}
      SQLRAG_JUDGE_MODEL: ${SQLRAG_JUDGE_MODEL:-qwen2.5:3b}
      SQLRAG_NUM_GPU: ${SQLRAG_NUM_GPU:--1}
      SQLRAG_ADMIN_TOKEN: ${SQLRAG_ADMIN_TOKEN:-}
      SQLRAG_ALLOW_INGEST: ${SQLRAG_ALLOW_INGEST:-1}
      SQLRAG_CORS_ORIGINS: ${SQLRAG_CORS_ORIGINS:-http://localhost:8000}
      SQLRAG_GROUNDING_POLICY: ${SQLRAG_GROUNDING_POLICY:-abstain}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - rag_store:/app/rag_store           # ChromaDB index + registry
      - uploads:/app/corpus/uploads        # documents added through the UI
      - labels:/app/data/labels            # human labels
      - results:/app/results               # experiment results (seeded from the image)
      - reports:/app/reports               # generated PDF reports
    restart: unless-stopped

volumes:
  ollama:
  rag_store:
  uploads:
  labels:
  results:
  reports:
