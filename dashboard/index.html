<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQL Explanation Grader — A/B</title>
<style>
body{font-family:system-ui,Arial;background:#0b1020;color:#e8edf8;margin:0;padding:24px}
h1{margin:0 0 8px}.sub{color:#9aa6bd;margin-bottom:20px}
select{padding:8px 12px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.card,.case{background:#141b2d;border:1px solid #26314d;border-radius:12px;padding:16px}
.big{font-size:28px;font-weight:700}.muted{color:#9aa6bd}
table{width:100%;border-collapse:collapse;margin:16px 0;background:#141b2d}
th,td{padding:10px;border-bottom:1px solid #26314d;text-align:left}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:12px}
pre{white-space:pre-wrap;background:#0e1424;padding:12px;border-radius:8px}
.good{color:#6ee7a8}.bad{color:#ff8f8f}
@media(max-width:900px){.grid,.ab{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>SQL Explanation Grader — Model A vs Model B</h1>
<div class="sub">Judge pass rate, dimensions, pair outcomes, disagreement cases, latency and token use.</div>
<select id="run"></select>
<div id="summary"></div>
<div id="cases"></div>
<script>
const pct=(n,d)=>d?(100*n/d).toFixed(1)+'%':'—';
const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2):'—';
async function loadRuns(){
  const runs=await (await fetch('/api/runs')).json();
  run.innerHTML=runs.map(x=>'<option>'+x+'</option>').join('');
  run.onchange=load;
  if(runs.length) load();
}
async function load(){
  const rows=await (await fetch('/api/results/'+encodeURIComponent(run.value))).json();
  if(!rows.length){summary.innerHTML='<p>No comparison rows.</p>';cases.innerHTML='';return;}
  const n=rows.length,a=rows.reduce((s,r)=>s+(r.model_a?.score||0),0),b=rows.reduce((s,r)=>s+(r.model_b?.score||0),0);
  const out={}; rows.forEach(r=>out[r.outcome]=(out[r.outcome]||0)+1);
  const al=rows.map(r=>r.model_a?.generation_cost?.latency).filter(x=>x!=null);
  const bl=rows.map(r=>r.model_b?.generation_cost?.latency).filter(x=>x!=null);
  const ai=rows.map(r=>r.model_a?.generation_cost?.in_tok).filter(x=>x!=null);
  const bi=rows.map(r=>r.model_b?.generation_cost?.in_tok).filter(x=>x!=null);
  const ao=rows.map(r=>r.model_a?.generation_cost?.out_tok).filter(x=>x!=null);
  const bo=rows.map(r=>r.model_b?.generation_cost?.out_tok).filter(x=>x!=null);
  summary.innerHTML='<div class="grid">'+
    '<div class="card"><div class="muted">'+rows[0].model_a_name+'</div><div class="big">'+pct(a,n)+'</div>judge pass rate</div>'+
    '<div class="card"><div class="muted">'+rows[0].model_b_name+'</div><div class="big">'+pct(b,n)+'</div>judge pass rate</div>'+
    '<div class="card"><div class="muted">Disagreements</div><div class="big">'+rows.filter(r=>r.disagreement).length+'</div></div>'+
    '<div class="card"><div class="muted">Rows</div><div class="big">'+n+'</div></div></div>'+
    '<table><tr><th>Pair outcome</th><th>Count</th></tr>'+
    ['both_correct','only_a_correct','only_b_correct','both_wrong'].map(k=>'<tr><td>'+k+'</td><td>'+(out[k]||0)+'</td></tr>').join('')+'</table>'+
    '<table><tr><th>Metric</th><th>Model A</th><th>Model B</th></tr>'+
    '<tr><td>Avg generation latency (s)</td><td>'+avg(al)+'</td><td>'+avg(bl)+'</td></tr>'+
    '<tr><td>Avg input tokens</td><td>'+avg(ai)+'</td><td>'+avg(bi)+'</td></tr>'+
    '<tr><td>Avg output tokens</td><td>'+avg(ao)+'</td><td>'+avg(bo)+'</td></tr></table>';
  cases.innerHTML=rows.map(r=>'<div class="case"><b>'+r.id+'</b> <span class="muted">'+(r.categories||[]).join(', ')+' · '+r.outcome+'</span>'+
    '<pre>'+escapeHtml(r.sql||'')+'</pre><div class="ab">'+panel('A',r.model_a,r.model_a_name)+panel('B',r.model_b,r.model_b_name)+'</div></div>').join('');
}
function panel(label,m,name){if(!m)return '<div></div>';const d=m.dimensions||{};return '<div><h3>'+label+' — '+name+' <span class="'+(m.score?'good':'bad')+'">'+(m.score?'PASS':'FAIL')+'</span></h3>'+
'<div class="muted">correct '+!!d.correctness+' · complete '+!!d.completeness+' · no hallucination '+!!d.hallucination_free+' · clear '+!!d.clarity+'</div>'+
'<pre>'+escapeHtml(m.explanation||'')+'</pre><div>'+escapeHtml(m.judge_reason||'')+'</div></div>'}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
loadRuns();
</script>
</body></html>
