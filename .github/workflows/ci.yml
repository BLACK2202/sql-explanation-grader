name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check sqlrag tests scripts

      - name: Validate dataset
        run: python harness/validate.py

      - name: Unit, API and regression tests (offline; Ollama tests are skipped)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image (without baking the embedding model)
        run: docker build --build-arg PRELOAD_EMBEDDINGS=0 -t sql-explanation-grader:ci .
